<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Shopping Cart | SuppZone</title>
    <link href="css/styles.css" rel="stylesheet"/>
    <script src="js/app.js" type="module"></script>
    <style></style>
</head>

<body class="min-h-screen bg-[#101214] text-white antialiased">

<div id="site-header"></div>

    <main class="mx-auto flex w-full max-w-[1250px] flex-col gap-14 px-4 py-10 md:px-5">
    <div>
    <h1>Shopping Cart</h1>
    <p>Review your items before checkout</p>
    </div>

      <section>
        <h2>Cart Items</h2>
    <div id="cart-items">
    </div>  
    </section>

    <section>
        <h2>Order Summary</h2>
        <div id="order-summary">
        <div>
            
        <span>Subtotal:</span>
        <span id="subtotal">0₪</span>
        </div>
    
        <div>
        <span>Shipping:</span>
        <span id="shipping">0₪</span>
        </div>

        <div>
        <span>Total:</span>
        <span id="total">0₪</span>
        </div>
    </div>
    <a href="checkoutinfo.html">Proceed to Checkout</a>
    </section>

    <section>
        <div id="empty-cart">
            <h2>Empty Cart</h2>
            <p>Your cart is empty</p>
            <a href="shop.html">Continue Shopping</a>
        </div>
    </section>
    </main>

<div id="site-footer"></div>


</body>
</html>
