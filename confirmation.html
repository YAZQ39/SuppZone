<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | SuppZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/styles.css" rel="stylesheet"/>
    <script src="js/app.js" type="module"></script>
    <style></style>
</head>

<body class="min-h-screen bg-[#101214] text-white antialiased">

<div id="site-header"></div>

    <main class="mx-auto flex w-full max-w-[1250px] flex-col gap-14 px-4 py-10 md:px-5">
        <div>
            <h1>Order Confirmed!</h1>
            <p>Thank you for your order. Your order has been successfully placed.</p>
        </div>

        <div>
            <span>Order Number:</span> <span id="order-number">#0000</span>
        </div>

        <section>
            <h2>Order Summary</h2>
            <div id="confirmation-items">
            </div>
            <div>
                <span>Total:</span> <span id="confirmation-total">0₪</span>
            </div>
        </section>

        <section>
            <h2>Delivery Information</h2>
            <div id="delivery-address">
            </div>
        </section>
        <div>
            <a href="orders.html">View My Orders</a>
            <a href="shop.html">Continue Shopping</a>
        </div>
    </main>

<div id="site-footer"></div>


</body>
</html>
