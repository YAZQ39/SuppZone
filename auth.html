<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | SuppZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/styles.css" rel="stylesheet"/>
    <script src="js/app.js" type="module"></script>
    <style></style>
</head>

<body class="min-h-screen bg-[#101214] text-white antialiased">

<div id="site-header"></div>

    <main class="mx-auto flex min-h-[580px] w-full max-w-[1250px] items-center justify-center px-4 py-12 sm:px-5 sm:py-16">

        <section class="w-full max-w-[520px]">

            <div class="mb-6">
                <p class="mb-2 text-xs font-black uppercase tracking-[0.18em] text-[#c6f135]">Welcome</p>

                <h1 class="text-3xl font-black tracking-tight text-white sm:text-4xl">Account access</h1>

                <p class="mt-3 text-sm leading-6 text-[#a0a5ac]">Sign in or create an account to continue.</p>
          
            </div>

            <div role="group" aria-label="Choose login or register" class="grid grid-cols-2 gap-x-2 gap-y-0 rounded-xl border border-[#30363b] bg-[#1c2024] p-5 sm:p-7">

                <input id="auth-login" type="radio" name="auth-mode" value="login" checked class="peer/login sr-only">
                <input id="auth-register" type="radio" name="auth-mode" value="register" class="peer/register sr-only">

                <label for="auth-login" class="flex min-h-11 cursor-pointer items-center justify-center rounded-lg border border-[#30363b] bg-[#101214] px-3 text-sm font-bold text-[#a0a5ac] transition peer-checked/login:border-[#c6f135] peer-checked/login:bg-[#c6f135] peer-checked/login:text-[#101214] peer-focus-visible/login:ring-2 peer-focus-visible/login:ring-[#c6f135]">Login</label>
                <label for="auth-register" class="flex min-h-11 cursor-pointer items-center justify-center rounded-lg border border-[#30363b] bg-[#101214] px-3 text-sm font-bold text-[#a0a5ac] transition peer-checked/register:border-[#c6f135] peer-checked/register:bg-[#c6f135] peer-checked/register:text-[#101214] peer-focus-visible/register:ring-2 peer-focus-visible/register:ring-[#c6f135]">Register</label>

                <section class="col-span-2 mt-6 hidden peer-checked/login:block" aria-labelledby="login-heading">

                    <h2 id="login-heading" class="mb-1 text-lg font-bold text-white">Welcome back</h2>
                    <p class="mb-5 text-sm text-[#a0a5ac]">Please sign in to continue.</p>

                    <form>
                        <div class="space-y-4">

                            <div>
                                <label for="login-email" class="mb-2 block text-sm font-semibold text-[#e5e7e8]">Email</label>

                                <input id="login-email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required class="min-h-12 w-full rounded-lg border border-[#30363b] bg-[#101214] px-4 py-3 text-sm text-white outline-none transition placeholder:text-[#737b83] focus:border-[#c6f135]">
                            </div>

                            <div>
                                <label for="login-password" class="mb-2 block text-sm font-semibold text-[#e5e7e8]">Password</label>

                                <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required class="min-h-12 w-full rounded-lg border border-[#30363b] bg-[#101214] px-4 py-3 text-sm text-white outline-none transition placeholder:text-[#737b83] focus:border-[#c6f135]">
                            </div>

                        </div>

                        <button type="button" class="mt-6 min-h-12 w-full rounded-lg bg-[#c6f135] px-4 py-3 text-sm font-black uppercase tracking-wide text-[#101214] transition hover:brightness-95"> Login </button>
                    </form>

                </section>

                <section class="col-span-2 mt-6 hidden peer-checked/register:block" aria-labelledby="register-heading">
                    
                    <h2 id="register-heading" class="mb-1 text-lg font-bold text-white"> Create your account </h2>
                    <p class="mb-5 text-sm text-[#a0a5ac]"> Enter your details to get started.</p>

                    <form>
                        <div class="space-y-4">

                            <div>
                                <label for="register-name" class="mb-2 block text-sm font-semibold text-[#e5e7e8]"> Name </label>

                                <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Your name" required class="min-h-12 w-full rounded-lg border border-[#30363b] bg-[#101214] px-4 py-3 text-sm text-white outline-none transition placeholder:text-[#737b83] focus:border-[#c6f135]">
                            </div>

                            <div>
                                <label for="register-email" class="mb-2 block text-sm font-semibold text-[#e5e7e8]"> Email </label>

                                <input id="register-email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required class="min-h-12 w-full rounded-lg border border-[#30363b] bg-[#101214] px-4 py-3 text-sm text-white outline-none transition placeholder:text-[#737b83] focus:border-[#c6f135]">
                            </div>

                            <div>
                                <label for="register-password" class="mb-2 block text-sm font-semibold text-[#e5e7e8]"> Password </label>

                                <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required class="min-h-12 w-full rounded-lg border border-[#30363b] bg-[#101214] px-4 py-3 text-sm text-white outline-none transition placeholder:text-[#737b83] focus:border-[#c6f135]">
                            </div>

                        </div>

                        <button type="button" class="mt-6 min-h-12 w-full rounded-lg bg-[#c6f135] px-4 py-3 text-sm font-black uppercase tracking-wide text-[#101214] transition hover:brightness-95">Create account </button>
                    </form>

                </section>

                <p class="col-span-2 mt-6 border-t border-[#30363b] pt-5 text-center text-xs leading-6 text-[#a0a5ac]"> Your account, all in one place. Sign in to access your personal dashboard.</p>

            </div>

        </section>

    </main>

    <div id="site-footer"></div>

</body>

</html>
