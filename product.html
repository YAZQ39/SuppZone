<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | SuppZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/styles.css" rel="stylesheet"/>
    <script src="js/app.js" type="module"></script>
    <style></style>
</head>

<body class="min-h-screen bg-[#101214] text-white antialiased">

<div id="site-header"></div>

    <main id="product-page" data-product-id="" class="mx-auto flex w-full max-w-[1250px] flex-col gap-10 px-4 py-10 md:px-5">

        <nav aria-label="Breadcrumb" class="flex flex-wrap items-center gap-2 text-sm text-[#a0a5ac]">
            
            <a href="index.html" class="hover:text-[#c6f135]">Home</a>
            <span aria-hidden="true">/</span>
            <a href="shop.html" class="hover:text-[#c6f135]">Shop</a>

            <span id="product-category-crumb" hidden>

                <span aria-hidden="true" class="mr-2">/</span>
                <a id="product-category-link" href="shop.html" class="hover:text-[#c6f135]"></a>
            
            </span>

            <span aria-hidden="true">/</span>
            <span id="product-breadcrumb-name" aria-current="page" class="text-white">Product details</span>
        
        </nav>

        <section aria-labelledby="product-name" class="grid items-center gap-8 lg:grid-cols-2">

            <div class="relative flex min-h-[300px] items-center justify-center overflow-hidden rounded-2xl border border-[#30363b] bg-[#1c2024] p-5 sm:min-h-[420px] sm:p-8">

                <span id="product-sale-badge" hidden class="absolute left-4 top-4 z-10 rounded-full bg-[#c6f135] px-3 py-1 text-xs font-black uppercase text-[#101214]">
                    Sale
                </span>

                <button id="add-to-wishlist" data-product-action="wishlist" type="button" aria-label="Add to wishlist" disabled class="absolute right-3 top-3 grid h-10 w-10 place-items-center rounded-full border border-[#30363b] bg-[#1c2024] text-lg text-white transition hover:text-[#c6f135] cursor-pointer text-base font-semibold text-white no-underline transition hover:border-[#c6f135]">
                    <span aria-hidden="true" class="group-hover:hidden">♡</span>
                    <span aria-hidden="true" class="hidden text-red-500 group-hover:inline">♥</span>
                </button>

                <div id="product-image" class="grid w-full place-items-center">
                    <span class="text-sm text-[#a0a5ac]">Product image</span>
                </div>

            </div>

            <div>
                <p id="product-brand" class="mb-2 text-sm font-bold text-[#c6f135]">Brand</p>

                <h1 id="product-name" class="text-3xl font-black tracking-tight sm:text-4xl">
                    Product name
                </h1>

                <p id="product-rating-row" hidden class="mt-3 text-sm">
                    <span aria-hidden="true" class="mr-1 text-[#c6f135]">★</span>
                    <span id="product-rating" class="font-bold"></span>
                    <span id="product-review-count" class="ml-2 text-[#a0a5ac]"></span>
                </p>

                <div class="mt-5 flex flex-wrap items-baseline gap-3">
                    <span id="product-price" class="text-2xl font-black">0₪</span>
                    <span id="product-old-price" hidden class="text-sm text-[#a0a5ac] line-through"></span>
                </div>

                <p id="product-description" class="mt-4 text-sm leading-7 text-[#a0a5ac]">Product description</p>

                <div class="mt-6 border-t border-[#30363b] pt-5">

                    <label for="product-quantity" class="mb-2 block text-sm font-semibold"> Quantity </label>
                    <input id="product-quantity" name="quantity" type="number" min="1" value="1" class="w-24 rounded-lg border border-[#30363b] bg-[#1c2024] px-3 py-2.5 text-center focus:border-[#c6f135] focus:outline-none">

                    <button id="add-to-cart" data-product-action="add-to-cart" type="button" disabled class="mt-4 w-full rounded-xl bg-[#c6f135] px-5 py-3.5 text-sm font-black uppercase tracking-wide text-[#101214] enabled:hover:bg-lime-300 cursor-pointer">
                        Add to Cart
                    </button>

                    <button id="add-to-compare" data-product-action="compare" type="button" disabled class="mt-2 py-2 text-sm font-semibold text-[#a0a5ac] enabled:hover:text-[#c6f135]">
                        <span aria-hidden="true" class="mr-1 text-[#c6f135]">⇄</span>
                        <span class="no-underline cursor-pointer transition-colors hover:text-white ">Add to compare</span>
                    </button>

                    <p id="product-action-message" role="status" class="sr-only"></p>
                </div>
            </div>

        </section>

        <section class="grid gap-8 border-t border-[#30363b] pt-8 lg:grid-cols-2">

            <div id="product-information">
                <h2 class="text-xl font-bold">Product information</h2>
                <p id="product-ingredients" class="mt-3 text-sm leading-7 text-[#a0a5ac]"></p>
                <p id="product-warnings" hidden class="mt-4 border-l-2 border-[#c6f135] pl-3 text-sm leading-6 text-[#a0a5ac]"></p>
            </div>

            <div id="product-specifications-section">
                <h2 class="text-xl font-bold">Specifications</h2>
                <dl id="product-specifications" class="mt-3 divide-y divide-[#30363b] text-sm"></dl>
            </div>

        </section>

        <section id="related-products-section" aria-labelledby="related-products-heading" hidden>
            <h2 id="related-products-heading" class="mb-5 text-xl font-bold">Related products</h2>
            <div id="related-products" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
        </section>

    </main>

        <section id="product-not-found" hidden class="mx-auto w-full max-w-[1250px] px-4 py-16 md:px-5">
            <h1 class="text-2xl font-bold">Product unavailable</h1>
            <a href="shop.html" class="mt-4 inline-block text-sm font-bold text-[#c6f135]">Back to shop</a>
        </section>

    <div id="site-footer"></div>

</body>

</html>
